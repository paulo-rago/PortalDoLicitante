      `data_encerramento` date DEFAULT NULL,
      `fk_Edital_de_Licitacao_id_licitacao` int NOT NULL,
      `fk_analista_de_licitacao_id_funcionario` int NOT NULL,
      PRIMARY KEY (`id_pregao`),
      KEY `fk_Edital_de_Licitacao_id_licitacao` (`fk_Edital_de_Licitacao_id_licitacao`),
      KEY `fk_analista_de_licitacao_id_funcionario` (`fk_analista_de_licitacao_id_funcionario`),
      CONSTRAINT `pregao_ibfk_1` FOREIGN KEY (`fk_Edital_de_Licitacao_id_licitacao`) REFERENCES `edital_de_licitacao` (`id_licitacao`),
      CONSTRAINT `pregao_ibfk_2` FOREIGN KEY (`fk_analista_de_licitacao_id_funcionario`) REFERENCES `analista_de_licitacao` (`fk_Funcionario_id_funcionario`)
    ) ENGINE=InnoDB AUTO_INCREMENT=124 DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;

    --
    -- Table structure for table `lote`
