    CREATE TABLE `funcionario` (
      `id_funcionario` int NOT NULL AUTO_INCREMENT,
      `nome_funcionario` varchar(100) DEFAULT NULL,
      `CPF` varchar(14) DEFAULT NULL,
      `email_corporativo` varchar(100) DEFAULT NULL,
