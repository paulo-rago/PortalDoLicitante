      `modelo_veiculo` varchar(50) DEFAULT NULL,
      `ano_fabricacao_veiculo` varchar(4) DEFAULT NULL,
      `tipo_veiculo` varchar(50) DEFAULT NULL,
      `fk_Empresa_id_empresa` int DEFAULT NULL,
      `fk_Edital_de_Licitacao_id_licitacao` int DEFAULT NULL,
      `fk_Pregao_id_pregao` int DEFAULT NULL,
      `valor_arremate` decimal(15,2) DEFAULT NULL,
      PRIMARY KEY (`id_lote`),
      KEY `fk_Empresa_id_empresa` (`fk_Empresa_id_empresa`),
      KEY `fk_Edital_de_Licitacao_id_licitacao` (`fk_Edital_de_Licitacao_id_licitacao`),
      KEY `fk_Pregao_id_pregao` (`fk_Pregao_id_pregao`),
      CONSTRAINT `lote_ibfk_1` FOREIGN KEY (`fk_Empresa_id_empresa`) REFERENCES `empresa` (`id_empresa`),
      CONSTRAINT `lote_ibfk_2` FOREIGN KEY (`fk_Edital_de_Licitacao_id_licitacao`) REFERENCES `edital_de_licitacao` (`id_licitacao`),
      CONSTRAINT `lote_ibfk_3` FOREIGN KEY (`fk_Pregao_id_pregao`) REFERENCES `pregao` (`id_pregao`)
    ) ENGINE=InnoDB AUTO_INCREMENT=71 DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;

    --
