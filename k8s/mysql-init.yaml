    -- Triggers
    DELIMITER //

    CREATE TRIGGER `after_funcionario_insert` AFTER INSERT ON `funcionario` FOR EACH ROW
    BEGIN
        INSERT INTO analista_de_licitacao (fk_funcionario_id_funcionario)
        VALUES (NEW.id_funcionario);
    END //

    CREATE TRIGGER `trg_delete_analista_before_funcionario` BEFORE DELETE ON `funcionario` FOR EACH ROW
    BEGIN
        DELETE FROM analista_de_licitacao
        WHERE fk_Funcionario_id_funcionario = OLD.id_funcionario;
    END //

    CREATE TRIGGER `trg_delete_pregao_before_edital` BEFORE DELETE ON `edital_de_licitacao` FOR EACH ROW
    BEGIN
      DELETE FROM pregao WHERE fk_Edital_de_Licitacao_id_licitacao = OLD.id_licitacao;
    END //

    CREATE TRIGGER `trg_delete_lote_before_pregao` BEFORE DELETE ON `pregao` FOR EACH ROW
    BEGIN
      DELETE FROM lote WHERE fk_Pregao_id_pregao = OLD.id_pregao;
    END //

    DELIMITER ;

    -- Stored Procedures
    DELIMITER //

    CREATE PROCEDURE `get_taxa_sucesso_licitacoes`(
        IN nome_empresa VARCHAR(100)
    )
    BEGIN
        DECLARE total_participados INT;
        DECLARE total_vencidos INT;

        SELECT COUNT(DISTINCT p.id_pregao)
        INTO total_participados
        FROM pregao p
        JOIN lote l ON l.fk_Pregao_id_pregao = p.id_pregao;

        SELECT COUNT(DISTINCT p.id_pregao)
        INTO total_vencidos
        FROM pregao p
        JOIN lote l ON l.fk_Pregao_id_pregao = p.id_pregao
        JOIN empresa e ON l.fk_Empresa_id_empresa = e.id_empresa
        WHERE e.nome = nome_empresa;

        SELECT 
            total_participados AS total_pregoes_participados,
            total_vencidos AS total_pregoes_vencidos,
            ROUND((total_vencidos / total_participados) * 100, 2) AS taxa_sucesso_percentual;
    END //

    CREATE PROCEDURE `get_valor_arrematado_por_ano`(IN nome_empresa VARCHAR(100))
    BEGIN
        SELECT 
            YEAR(p.data_encerramento) AS ano,
            SUM(l.valor_arremate) AS total_arrematado
        FROM lote l
        JOIN empresa e ON l.fk_Empresa_id_empresa = e.id_empresa
        JOIN pregao p ON l.fk_Pregao_id_pregao = p.id_pregao
        WHERE e.nome = nome_empresa
        GROUP BY ano
        ORDER BY ano;
    END //

    DELIMITER ; 