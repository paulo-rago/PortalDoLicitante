    ) ENGINE=InnoDB AUTO_INCREMENT=86 DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;

    --
    -- Table structure for table `pregao`
    --

    DROP TABLE IF EXISTS `pregao`;
    CREATE TABLE `pregao` (
      `id_pregao` int NOT NULL AUTO_INCREMENT,
      `numero_pregao` varchar(50) DEFAULT NULL,
      `status_pregao` varchar(20) DEFAULT NULL,
      `modelo_pregao` varchar(30) DEFAULT NULL,
      `modalidade` varchar(30) DEFAULT NULL,
